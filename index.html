<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Serra Dourada Bar e Restaurante</title>
<meta name="theme-color" content="#241608" />
<meta name="description" content="Cardápio, promoções, happy hour, eventos e contato do Serra Dourada Bar e Restaurante." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playball&family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
<style>
  :root {
    --dourado: #c9a227;
    --dourado-claro: #e8c766;
    --marrom: #1c1108;
    --marrom-2: #241608;
    --marrom-claro: #3a2712;
    --marrom-card: #2e1c0e;
    --texto: #f6ead0;
    --texto-suave: #cdbb99;
    --borda: #4a3520;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--marrom);
    color: var(--texto);
    min-height: 100vh;
  }
  .topo {
    text-align: center;
    padding: 22px 16px 8px calc(16px + env(safe-area-inset-left, 0px));
    padding-top: calc(22px + env(safe-area-inset-top, 0px));
  }
  .logo-script {
    font-family: 'Playball', cursive;
    font-size: 2.6rem;
    color: var(--dourado-claro);
    line-height: 1;
    margin: 0;
  }
  .logo-label {
    font-size: 0.7rem;
    letter-spacing: 0.32em;
    color: var(--texto-suave);
    margin-top: 4px;
    font-weight: 700;
  }
  .hero {
    margin: 18px 16px 0;
    border-radius: 18px;
    overflow: hidden;
    position: relative;
    aspect-ratio: 2 / 3;
    max-height: 68vh;
    background: radial-gradient(circle at 30% 20%, #4a3010, #1c1108 70%);
    display: flex;
    align-items: flex-end;
  }
  .hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .hero .placeholder-icone {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 4rem;
    opacity: 0.35;
  }
  .hero-legenda {
    position: relative;
    z-index: 1;
    padding: 22px 20px;
    background: linear-gradient(0deg, rgba(0,0,0,0.7), rgba(0,0,0,0.15) 65%, transparent);
    width: 100%;
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 1.15rem;
    line-height: 1.4;
    color: #fdf6e8;
  }
  .boas-vindas {
    text-align: center;
    padding: 18px 24px 4px;
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 1.05rem;
    color: var(--texto-suave);
    line-height: 1.5;
  }
  .destaques {
    padding: 20px 0 4px;
  }
  .destaques h2 {
    margin: 0 0 12px;
    padding: 0 16px;
    font-family: 'Playfair Display', serif;
    font-weight: 600;
    font-size: 1.15rem;
    letter-spacing: 0.01em;
    color: var(--dourado-claro);
    text-align: center;
  }
  .destaques-scroll {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding: 0 16px 6px;
    scroll-snap-type: x proximity;
    -webkit-overflow-scrolling: touch;
  }
  .destaques-scroll img {
    flex: 0 0 auto;
    width: 148px;
    aspect-ratio: 2 / 3;
    object-fit: cover;
    border-radius: 12px;
    scroll-snap-align: start;
    background: var(--marrom-card);
  }
  .botoes {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
    padding: 18px 16px calc(28px + env(safe-area-inset-bottom, 0px));
    max-width: 480px;
    margin: 0 auto;
  }
  .botao {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    text-align: left;
    padding: 15px 18px;
    border-radius: 10px;
    background: var(--marrom-card);
    border: 1px solid var(--borda);
    color: var(--texto);
    font-family: inherit;
    font-size: 0.96rem;
    font-weight: 600;
    letter-spacing: 0.015em;
    text-decoration: none;
    cursor: pointer;
    min-height: 56px;
    transition: transform 0.08s ease, border-color 0.15s ease, background 0.15s ease;
  }
  .botao:active { transform: scale(0.98); }
  .botao.destaque {
    background: var(--dourado);
    color: #241608;
    border-color: transparent;
    font-weight: 700;
  }
  .botao .icone {
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--dourado-claro);
  }
  .botao.destaque .icone { color: #241608; }
  .botao .icone svg { width: 100%; height: 100%; }
  .botao .seta {
    margin-left: auto;
    flex-shrink: 0;
    width: 15px;
    height: 15px;
    opacity: 0.5;
  }
  .carregando-botoes {
    text-align: center;
    color: var(--texto-suave);
    padding: 20px;
    font-size: 0.9rem;
  }
  footer {
    text-align: center;
    padding: 10px 16px calc(24px + env(safe-area-inset-bottom, 0px));
    color: #7a6448;
    font-size: 0.72rem;
  }

  /* Modal genérico para almoço / happy hour / horário / eventos */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(10, 6, 2, 0.72);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 50;
  }
  .overlay.aberto { display: flex; }
  .modal {
    background: var(--marrom-2);
    border: 1px solid var(--borda);
    border-top-left-radius: 20px;
    border-top-right-radius: 20px;
    width: 100%;
    max-width: 480px;
    max-height: 82vh;
    overflow-y: auto;
    padding: 20px 20px calc(24px + env(safe-area-inset-bottom, 0px));
  }
  .modal-topo {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .modal-topo h2 {
    margin: 0;
    font-family: 'Playfair Display', serif;
    font-weight: 600;
    font-size: 1.2rem;
    color: var(--dourado-claro);
  }
  .modal-fechar {
    background: var(--marrom-card);
    border: 1px solid var(--borda);
    color: var(--texto);
    width: 34px; height: 34px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    flex-shrink: 0;
  }
  .modal-fechar svg { width: 16px; height: 16px; }
  .modal-item {
    background: var(--marrom-card);
    border: 1px solid var(--borda);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 10px;
  }
  .modal-foto {
    width: 100%;
    max-height: 260px;
    object-fit: cover;
    border-radius: 12px;
    margin-bottom: 10px;
    display: block;
  }
  .modal-fotos {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .modal-fotos img {
    flex: 1;
    height: 140px;
    object-fit: cover;
    border-radius: 12px;
  }
  .modal-item h3 { margin: 0 0 4px; font-size: 0.95rem; color: var(--dourado-claro); }
  .modal-item p { margin: 0; font-size: 0.85rem; color: var(--texto-suave); line-height: 1.4; }
  .modal-vazio { text-align: center; color: var(--texto-suave); padding: 24px 0; font-size: 0.88rem; }
  .horario-linha {
    display: flex; justify-content: space-between;
    padding: 8px 4px;
    border-bottom: 1px solid var(--borda);
    font-size: 0.88rem;
  }
  .horario-linha:last-child { border-bottom: none; }
  #form-reserva label {
    display: block;
    font-size: 0.82rem;
    color: var(--texto-suave);
    margin-bottom: 6px;
  }
  #form-reserva input[type=text] {
    width: 100%;
    padding: 11px 13px;
    border-radius: 8px;
    border: 1px solid var(--borda);
    background: #1a1006;
    color: var(--texto);
    font-size: 0.92rem;
    margin-bottom: 12px;
    font-family: inherit;
  }
  .consentimento {
    display: flex !important;
    align-items: flex-start;
    gap: 8px;
    font-size: 0.78rem !important;
    color: var(--texto-suave);
    margin-bottom: 14px;
    cursor: pointer;
  }
  .consentimento input { margin-top: 3px; width: 16px; height: 16px; flex-shrink: 0; accent-color: var(--dourado); }
</style>
</head>
<body>
  <div class="topo">
    <p class="logo-script" id="logo-nome">Serra Dourada</p>
    <p class="logo-label">BAR E RESTAURANTE</p>
  </div>

  <div class="hero" id="hero">
    <div class="placeholder-icone">🍺</div>
    <div class="hero-legenda" id="hero-legenda"></div>
  </div>

  <p class="boas-vindas" id="boas-vindas">Bem-vindo!</p>

  <section class="destaques">
    <h2>Destaques da casa</h2>
    <div class="destaques-scroll">
      <img src="img/destaque-1.jpg" alt="Prato grelhado com acompanhamentos" loading="lazy" />
      <img src="img/destaque-2.jpg" alt="Filé à parmegiana" loading="lazy" />
      <img src="img/destaque-3.jpg" alt="Lombo grelhado com abacaxi" loading="lazy" />
      <img src="img/destaque-4.jpg" alt="Ceviche com manga" loading="lazy" />
      <img src="img/destaque-5.jpg" alt="Pernil na chapa com acompanhamentos" loading="lazy" />
    </div>
  </section>

  <nav class="botoes" id="botoes">
    <div class="carregando-botoes">Carregando…</div>
  </nav>

  <footer>Serra Dourada Bar e Restaurante · Goiânia/GO</footer>

  <div class="overlay" id="overlay">
    <div class="modal">
      <div class="modal-topo">
        <h2 id="modal-titulo">—</h2>
        <button class="modal-fechar" id="modal-fechar" aria-label="Fechar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div id="modal-corpo"></div>
      <form id="form-reserva" class="escondido">
        <label for="reserva-nome">Seu nome</label>
        <input type="text" id="reserva-nome" required autocomplete="name" />
        <label for="reserva-telefone">Seu WhatsApp</label>
        <input type="text" id="reserva-telefone" required autocomplete="tel" placeholder="Ex.: 62999998888" />
        <label class="consentimento">
          <input type="checkbox" id="reserva-consentimento" required />
          <span>Aceito ser contatado pelo Serra Dourada por WhatsApp sobre esta reserva e futuras novidades.</span>
        </label>
        <button type="submit" class="botao destaque" id="btn-continuar-whatsapp" style="width:100%">Continuar para o WhatsApp</button>
        <p class="modal-vazio" id="msg-reserva" style="padding:8px 0 0"></p>
      </form>
    </div>
  </div>

<script>
window.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var SUPABASE_URL = "https://bhxnhiggogosootbtwpb.supabase.co";
  var ANON_KEY = "sb_publishable_Zsg8lPJjUHK5-okGOuYc9g_VbKilzQG";
  var sb = window.supabase.createClient(SUPABASE_URL, ANON_KEY);

  var DIAS = ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
  var estabelecimentoId = null;
  var config = null;

  function escapeHtml(v) {
    return String(v == null ? "" : v)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function abrirModal(titulo, corpoHtml) {
    document.getElementById("modal-titulo").textContent = titulo;
    document.getElementById("modal-corpo").innerHTML = corpoHtml;
    document.getElementById("form-reserva").classList.add("escondido");
    document.getElementById("overlay").classList.add("aberto");
  }
  function fecharModal() {
    document.getElementById("overlay").classList.remove("aberto");
    document.getElementById("form-reserva").classList.add("escondido");
  }
  function abrirReserva() {
    document.getElementById("modal-titulo").textContent = "Fazer reserva";
    document.getElementById("modal-corpo").innerHTML =
      '<p class="modal-vazio" style="padding:0 0 4px;text-align:left">Deixe seu contato para confirmarmos e você será direcionado ao WhatsApp.</p>';
    document.getElementById("msg-reserva").textContent = "";
    document.getElementById("form-reserva").classList.remove("escondido");
    document.getElementById("overlay").classList.add("aberto");
  }
  document.getElementById("modal-fechar").addEventListener("click", fecharModal);
  document.getElementById("overlay").addEventListener("click", function (e) {
    if (e.target.id === "overlay") fecharModal();
  });

  function registrar(tipo, botaoTipo) {
    if (!estabelecimentoId) return;
    sb.from("pagina_acesso_log").insert({
      estabelecimento_id: estabelecimentoId,
      tipo: tipo,
      botao_tipo: botaoTipo || null,
    }).then(function () {});
  }

  function formatarHora(t) {
    if (!t) return "";
    return t.slice(0, 5);
  }

  async function mostrarHorario() {
    var h = (config && config.horario_funcionamento) || {};
    var linhas = DIAS.map(function (nome, i) {
      var v = h[String(i)];
      var texto = v && v.abre && v.fecha ? formatarHora(v.abre) + " – " + formatarHora(v.fecha) : "Fechado";
      return '<div class="horario-linha"><span>' + nome + '</span><span>' + escapeHtml(texto) + '</span></div>';
    }).join("");
    abrirModal("Horário de funcionamento", linhas || '<p class="modal-vazio">Horário não configurado ainda.</p>');
  }

  async function mostrarAlmoco() {
    var r = await sb.from("almoco_dia").select("descricao,imagem_url,data").eq("ativo", true).limit(1).maybeSingle();
    if (!r.data) {
      abrirModal("Almoço de hoje", '<p class="modal-vazio">O almoço de hoje ainda não foi publicado.</p>');
      return;
    }
    var imagemHtml = r.data.imagem_url
      ? '<img class="modal-foto" src="' + escapeHtml(r.data.imagem_url) + '" alt="Almoço de hoje" />'
      : "";
    abrirModal("Almoço de hoje", imagemHtml + '<div class="modal-item"><p>' + escapeHtml(r.data.descricao).replace(/\n/g, "<br>") + "</p></div>");
  }

  async function mostrarHappyHour() {
    var [hhRes, promoRes] = await Promise.all([
      sb.from("happy_hour").select("descricao,dias_semana,horario_inicio,horario_fim,ativo").maybeSingle(),
      sb.from("promocao").select("titulo,descricao,valido_ate").order("ordem", { ascending: true }),
    ]);

    var blocos = [];

    if (hhRes.data && hhRes.data.ativo) {
      var dias = (hhRes.data.dias_semana || []).map(function (d) { return DIAS[d]; }).join(", ");
      var periodo = formatarHora(hhRes.data.horario_inicio) + " às " + formatarHora(hhRes.data.horario_fim);
      blocos.push(
        '<div class="modal-fotos"><img src="img/happyhour-1.jpg" alt="Drinks do Happy Hour" /><img src="img/happyhour-3.jpg" alt="Petisco do Happy Hour" /></div>'
      );
      blocos.push(
        '<div class="modal-item"><h3>Happy Hour · ' + escapeHtml(dias || "Todos os dias") + '</h3><p>' + escapeHtml(periodo) + '</p>' +
        (hhRes.data.descricao ? '<p>' + escapeHtml(hhRes.data.descricao).replace(/\n/g, "<br>") + '</p>' : '') +
        '</div>'
      );
    }

    (promoRes.data || []).forEach(function (p) {
      var validade = p.valido_ate ? " · válida até " + new Date(p.valido_ate + "T00:00:00").toLocaleDateString("pt-BR") : "";
      blocos.push(
        '<div class="modal-item"><h3>' + escapeHtml(p.titulo) + escapeHtml(validade) + '</h3>' +
        (p.descricao ? '<p>' + escapeHtml(p.descricao).replace(/\n/g, "<br>") + '</p>' : '') +
        '</div>'
      );
    });

    abrirModal("Happy Hour e promoções", blocos.join("") || '<p class="modal-vazio">Nenhum Happy Hour ou promoção ativa no momento.</p>');
  }

  async function mostrarEventos() {
    var r = await sb.from("evento").select("titulo,descricao,data_hora").eq("ativo", true).gte("data_hora", new Date().toISOString()).order("data_hora", { ascending: true });
    if (!r.data || r.data.length === 0) {
      abrirModal("Próximos eventos", '<p class="modal-vazio">Nenhum evento programado no momento.</p>');
      return;
    }
    var html = r.data.map(function (ev) {
      var data = new Date(ev.data_hora).toLocaleString("pt-BR", { weekday: "long", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
      return '<div class="modal-item"><h3>' + escapeHtml(ev.titulo) + '</h3><p>' + escapeHtml(data) + '</p>' +
        (ev.descricao ? '<p>' + escapeHtml(ev.descricao) + '</p>' : '') + '</div>';
    }).join("");
    abrirModal("Próximos eventos", html);
  }

  function linkWhatsapp(mensagem) {
    var numero = (config && config.whatsapp || "").replace(/\D/g, "");
    if (!numero) return null;
    return "https://wa.me/" + numero + (mensagem ? "?text=" + encodeURIComponent(mensagem) : "");
  }

  var ACOES = {
    cardapio: function () { registrar("click", "cardapio"); location.href = "cardapio.html"; },
    almoco: function () { registrar("click", "almoco"); mostrarAlmoco(); },
    happy_hour: function () { registrar("click", "happy_hour"); mostrarHappyHour(); },
    horario: function () { registrar("click", "horario"); mostrarHorario(); },
    eventos: function () { registrar("click", "eventos"); mostrarEventos(); },
    reserva_whatsapp: function () { registrar("click", "reserva_whatsapp"); abrirReserva(); },
  };

  document.getElementById("form-reserva").addEventListener("submit", async function (ev) {
    ev.preventDefault();
    var msgEl = document.getElementById("msg-reserva");
    var nome = document.getElementById("reserva-nome").value.trim();
    var telefone = document.getElementById("reserva-telefone").value.replace(/\D/g, "");
    msgEl.textContent = "";
    if (!nome || !telefone) {
      msgEl.textContent = "Preencha seu nome e WhatsApp.";
      return;
    }
    var link = linkWhatsapp("Olá! Meu nome é " + nome + ", gostaria de fazer uma reserva no Serra Dourada.");
    if (!link) {
      msgEl.textContent = "Reservas por WhatsApp indisponíveis no momento. Tente outro contato.";
      return;
    }
    try {
      await sb.from("contato_publico").insert({
        estabelecimento_id: estabelecimentoId,
        nome: nome,
        telefone: telefone,
        mensagem: "Reserva solicitada pelo botão do site (WhatsApp)",
        status: "novo",
      });
    } catch (e) { /* não bloqueia o cliente se o registro falhar */ }
    window.open(link, "_blank", "noopener");
    fecharModal();
    document.getElementById("form-reserva").reset();
  });

  var SW = 'fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"';
  var ICONES = {
    cardapio: '<svg viewBox="0 0 24 24" ' + SW + '><path d="M4 5.5C4 4.7 4.7 4 5.5 4H12v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M20 5.5c0-.8-.7-1.5-1.5-1.5H12v16h6.5a1.5 1.5 0 0 0 1.5-1.5z"/></svg>',
    almoco: '<svg viewBox="0 0 24 24" ' + SW + '><path d="M7 3v7a2 2 0 1 0 4 0V3M9 10v11M15 3c-1.5 1.5-2 3-2 5s1 3 2 3v10"/></svg>',
    happy_hour: '<svg viewBox="0 0 24 24" ' + SW + '><path d="M6 3h6l-1 8a2 2 0 0 1-2 2 2 2 0 0 1-2-2z"/><path d="M9 13v8M6 21h6"/><path d="M15 8l1.5 1.5L20 6"/><circle cx="17" cy="15" r="4"/><path d="M17 19v2M15 21h4"/></svg>',
    reserva_whatsapp: '<svg viewBox="0 0 24 24" ' + SW + '><path d="M4 20l1.3-3.9A8 8 0 1 1 8.9 19z"/><path d="M8.5 9.5c0 3.5 2.5 6 6 6"/></svg>',
    maps: '<svg viewBox="0 0 24 24" ' + SW + '><path d="M12 21s7-6.6 7-11.5A7 7 0 0 0 5 9.5C5 14.4 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.2"/></svg>',
    horario: '<svg viewBox="0 0 24 24" ' + SW + '><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
    eventos: '<svg viewBox="0 0 24 24" ' + SW + '><path d="M9 18V5l10-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>',
    avaliar_google: '<svg viewBox="0 0 24 24" ' + SW + '><path d="M12 3.5l2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>',
    instagram: '<svg viewBox="0 0 24 24" ' + SW + '><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="0.6" fill="currentColor" stroke="none"/></svg>',
    trabalhe_conosco: '<svg viewBox="0 0 24 24" ' + SW + '><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M8 8V6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
  };
  var SETA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';

  function urlPadrao(tipo) {
    if (tipo === "trabalhe_conosco") return linkWhatsapp("Olá! Tenho interesse em trabalhar no Serra Dourada.");
    if (tipo === "maps") return config && config.google_maps_url;
    if (tipo === "avaliar_google") return config && config.avaliacao_url;
    if (tipo === "instagram") return config && config.instagram_url;
    return null;
  }

  function renderBotoes(botoes) {
    var nav = document.getElementById("botoes");
    if (!botoes.length) {
      nav.innerHTML = '<p class="modal-vazio">Nenhum botão configurado ainda.</p>';
      return;
    }
    nav.innerHTML = "";
    botoes.forEach(function (b, i) {
      var url = b.url || urlPadrao(b.tipo);
      var el;
      if (ACOES[b.tipo] && !url) {
        el = document.createElement("button");
        el.type = "button";
        el.addEventListener("click", ACOES[b.tipo]);
      } else if (url) {
        el = document.createElement("a");
        el.href = url;
        el.target = "_blank";
        el.rel = "noopener";
        el.addEventListener("click", function () { registrar("click", b.tipo); });
      } else {
        return; // sem ação nem link configurado — não mostra
      }
      el.className = "botao" + (i === 0 ? " destaque" : "");
      el.innerHTML =
        '<span class="icone">' + (ICONES[b.tipo] || "") + '</span>' +
        '<span>' + escapeHtml(b.label) + '</span>' +
        '<span class="seta">' + SETA + '</span>';
      nav.appendChild(el);
    });
  }

  async function carregar() {
    try {
      var estRes = await sb.from("estabelecimento").select("id,nome_fantasia,nome").limit(1).maybeSingle();
      if (!estRes.data) return;
      estabelecimentoId = estRes.data.id;
      var nomeCurto = (estRes.data.nome_fantasia || estRes.data.nome || "").replace(/bar e restaurante/i, "").trim();
      if (nomeCurto) document.getElementById("logo-nome").textContent = nomeCurto;

      var [cfgRes, botoesRes] = await Promise.all([
        sb.from("pagina_config").select("*").eq("estabelecimento_id", estabelecimentoId).maybeSingle(),
        sb.from("botao_pagina").select("*").eq("estabelecimento_id", estabelecimentoId).eq("ativo", true).order("ordem", { ascending: true }),
      ]);

      config = cfgRes.data;
      if (config) {
        var mensagem = config.mensagem_boas_vindas || "";
        if (config.imagem_hero_url) {
          document.getElementById("hero").innerHTML =
            '<img src="' + escapeHtml(config.imagem_hero_url) + '" alt="Serra Dourada" loading="eager" />' +
            '<div class="hero-legenda">' + escapeHtml(mensagem) + '</div>';
          document.getElementById("boas-vindas").remove();
        } else {
          document.getElementById("boas-vindas").textContent = mensagem;
        }
      }

      renderBotoes(botoesRes.data || []);
      registrar("pageview", null);
    } catch (e) {
      document.getElementById("botoes").innerHTML = '<p class="modal-vazio">Não foi possível carregar a página. Verifique sua conexão.</p>';
    }
  }

  carregar();
});
</script>
</body>
</html>
