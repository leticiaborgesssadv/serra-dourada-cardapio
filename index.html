<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Serra Dourada Bar e Restaurante</title>
<meta name="theme-color" content="#241608" />
<meta name="description" content="Cardápio, promoções, happy hour, eventos e contato do Serra Dourada Bar e Restaurante." />

<meta property="og:type" content="website" />
<meta property="og:title" content="Serra Dourada Bar e Restaurante" />
<meta property="og:description" content="Cardápio, almoço, happy hour, promoções e reservas do Serra Dourada Bar e Restaurante." />
<meta property="og:image" content="https://serradouradabar.com.br/img/hero.jpg" />
<meta property="og:url" content="https://serradouradabar.com.br/" />

<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png" />
<link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
<link rel="manifest" href="manifest.json" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playball&family=Playfair+Display:ital,wght@0,600;0,700;1,500&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
<style>
  :root {
    --dourado: #c9a227;
    --dourado-claro: #e8c766;
    --marrom: #1c1108;
    --marrom-2: #241608;
    --marrom-claro: #3a2712;
    --marrom-card: #2e1c0e;
    --texto: #f6ead0;
    --texto-suave: #cdbb99;
    --borda: #4a3520;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--marrom);
    color: var(--texto);
    min-height: 100vh;
  }
  .topo {
    text-align: center;
    padding: 22px 16px 8px calc(16px + env(safe-area-inset-left, 0px));
    padding-top: calc(22px + env(safe-area-inset-top, 0px));
  }
  .logo-script {
    font-family: 'Playball', cursive;
    font-size: 2.6rem;
    color: var(--dourado-claro);
    line-height: 1;
    margin: 0;
  }
  .logo-label {
    font-size: 0.7rem;
    letter-spacing: 0.32em;
    color: var(--texto-suave);
    margin-top: 4px;
    font-weight: 700;
  }
  .logo-imagem {
    max-width: 190px;
    max-height: 130px;
    width: auto;
    height: auto;
    margin: 0 auto;
    display: block;
  }
  .hero {
    margin: 18px 16px 0;
    border-radius: 18px;
    overflow: hidden;
    position: relative;
    aspect-ratio: 2 / 3;
    max-height: 68vh;
    background: radial-gradient(circle at 30% 20%, #4a3010, #1c1108 70%);
    display: flex;
    align-items: flex-end;
  }
  .hero img { width: 100%; height: 100%; object-fit: cover; object-position: center 70%; display: block; }
  .hero .placeholder-icone {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 4rem;
    opacity: 0.35;
  }
  .hero-legenda {
    position: relative;
    z-index: 1;
    padding: 22px 20px;
    background: linear-gradient(0deg, rgba(0,0,0,0.7), rgba(0,0,0,0.15) 65%, transparent);
    width: 100%;
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 1.15rem;
    line-height: 1.4;
    color: #fdf6e8;
  }
  .boas-vindas {
    text-align: center;
    padding: 18px 24px 4px;
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 1.05rem;
    color: var(--texto-suave);
    line-height: 1.5;
  }
  .destaques {
    padding: 22px 16px 6px;
    max-width: 480px;
    margin: 0 auto;
  }
  .destaques h2 {
    margin: 0 0 14px;
    font-family: 'Playfair Display', serif;
    font-weight: 600;
    font-size: 1.2rem;
    letter-spacing: 0.01em;
    color: var(--dourado-claro);
    text-align: center;
  }
  .destaques-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .destaques-grid figure {
    margin: 0;
    border-radius: 14px;
    overflow: hidden;
    background: var(--marrom-card);
    aspect-ratio: 4 / 3;
  }
  .destaques-grid figure:first-child {
    grid-column: span 2;
    aspect-ratio: 16 / 10;
  }
  .destaques-grid img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .botoes {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
    padding: 18px 16px calc(28px + env(safe-area-inset-bottom, 0px));
    max-width: 480px;
    margin: 0 auto;
  }
  .botao {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    text-align: left;
    padding: 15px 18px;
    border-radius: 10px;
    background: var(--marrom-card);
    border: 1px solid var(--borda);
    color: var(--texto);
    font-family: inherit;
    font-size: 0.96rem;
    font-weight: 600;
    letter-spacing: 0.015em;
    text-decoration: none;
    cursor: pointer;
    min-height: 56px;
    transition: transform 0.08s ease, border-color 0.15s ease, background 0.15s ease;
  }
  .botao:active { transform: scale(0.98); }
  .botao.destaque {
    background: var(--dourado);
    color: #241608;
    border-color: transparent;
    font-weight: 700;
  }
  .botao .icone {
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--dourado-claro);
  }
  .botao.destaque .icone { color: #241608; }
  .botao .icone svg { width: 100%; height: 100%; }
  .botao .seta {
    margin-left: auto;
    flex-shrink: 0;
    width: 15px;
    height: 15px;
    opacity: 0.5;
  }
  .carregando-botoes {
    text-align: center;
    color: var(--texto-suave);
    padding: 20px;
    font-size: 0.9rem;
  }
  .badge-ativo {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-left: 8px;
    padding: 2px 8px;
    border-radius: 20px;
    background: #3a8f52;
    color: #eafff0;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.01em;
    vertical-align: middle;
  }
  .badge-ativo::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #7cf7a3;
    box-shadow: 0 0 4px #7cf7a3;
  }
  body { padding-bottom: 74px; }
  .barra-fixa {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 40;
    display: flex;
    gap: 10px;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
    background: rgba(28, 17, 8, 0.97);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    border-top: 1px solid var(--borda);
  }
  .barra-fixa button {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 12px;
    border-radius: 10px;
    font-family: inherit;
    font-weight: 700;
    font-size: 0.86rem;
    border: none;
    cursor: pointer;
    min-height: 46px;
  }
  .barra-fixa .icone { width: 18px; height: 18px; flex-shrink: 0; }
  .barra-fixa .icone svg { width: 100%; height: 100%; }
  .barra-fixa .principal { background: var(--dourado); color: #241608; }
  .barra-fixa .secundaria { background: var(--marrom-card); color: var(--texto); border: 1px solid var(--borda); }
  footer {
    text-align: center;
    padding: 10px 16px calc(24px + env(safe-area-inset-bottom, 0px));
    color: #7a6448;
    font-size: 0.72rem;
  }

  /* Modal genérico para almoço / happy hour / horário / eventos */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(10, 6, 2, 0.72);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 50;
  }
  .overlay.aberto { display: flex; }
  .modal {
    background: var(--marrom-2);
    border: 1px solid var(--borda);
    border-top-left-radius: 20px;
    border-top-right-radius: 20px;
    width: 100%;
    max-width: 480px;
    max-height: 82vh;
    overflow-y: auto;
    padding: 20px 20px calc(24px + env(safe-area-inset-bottom, 0px));
  }
  .modal-topo {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .modal-topo h2 {
    margin: 0;
    font-family: 'Playfair Display', serif;
    font-weight: 600;
    font-size: 1.2rem;
    color: var(--dourado-claro);
  }
  .modal-fechar {
    background: var(--marrom-card);
    border: 1px solid var(--borda);
    color: var(--texto);
    width: 34px; height: 34px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    flex-shrink: 0;
  }
  .modal-fechar svg { width: 16px; height: 16px; }
  .modal-item {
    background: var(--marrom-card);
    border: 1px solid var(--borda);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 10px;
  }
  .modal-foto {
    width: 100%;
    max-height: 260px;
    object-fit: cover;
    border-radius: 12px;
    margin-bottom: 10px;
    display: block;
  }
  .modal-fotos {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .modal-fotos img {
    flex: 1;
    height: 140px;
    object-fit: cover;
    border-radius: 12px;
  }
  .modal-item h3 { margin: 0 0 4px; font-size: 0.95rem; color: var(--dourado-claro); }
  .modal-item p { margin: 0; font-size: 0.85rem; color: var(--texto-suave); line-height: 1.4; }
  .hh-itens { margin-top: 10px; display: flex; flex-direction: column; gap: 0; }
  .hh-item { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--borda); }
  .hh-item-esquerda { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .hh-item-foto { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
  .hh-item-nome { font-size: 0.88rem; color: var(--texto); }
  .hh-item-precos { white-space: nowrap; text-align: right; }
  .hh-item-preco-de { text-decoration: line-through; color: var(--texto-suave); font-size: 0.78rem; margin-right: 6px; }
  .hh-item-preco-por { color: var(--dourado-claro); font-weight: 700; font-size: 0.92rem; }
  .modal-vazio { text-align: center; color: var(--texto-suave); padding: 24px 0; font-size: 0.88rem; }
  .horario-linha {
    display: flex; justify-content: space-between;
    padding: 8px 4px;
    border-bottom: 1px solid var(--borda);
    font-size: 0.88rem;
  }
  .horario-linha:last-child { border-bottom: none; }
  #form-reserva label {
    display: block;
    font-size: 0.82rem;
    color: var(--texto-suave);
    margin-bottom: 6px;
  }
  #form-reserva input[type=text] {
    width: 100%;
    padding: 11px 13px;
    border-radius: 8px;
    border: 1px solid var(--borda);
    background: #1a1006;
    color: var(--texto);
    font-size: 0.92rem;
    margin-bottom: 12px;
    font-family: inherit;
  }
  .consentimento {
    display: flex !important;
    align-items: flex-start;
    gap: 8px;
    font-size: 0.78rem !important;
    color: var(--texto-suave);
    margin-bottom: 14px;
    cursor: pointer;
  }
  .consentimento input { margin-top: 3px; width: 16px; height: 16px; flex-shrink: 0; accent-color: var(--dourado); }

  .escondido { display: none !important; }

  @keyframes surgir { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .topo, .hero, .boas-vindas, .destaques, .avaliacoes, .botoes {
    animation: surgir 0.5s ease both;
  }
  .hero { animation-delay: 0.05s; }
  .boas-vindas { animation-delay: 0.1s; }
  .destaques { animation-delay: 0.15s; }
  .avaliacoes { animation-delay: 0.18s; }
  .botoes { animation-delay: 0.2s; }
  .botao { transition: transform 0.08s ease, border-color 0.15s ease, background 0.15s ease, opacity 0.2s ease; }

  .skeleton { background: linear-gradient(100deg, var(--marrom-card) 30%, #3a2712 45%, var(--marrom-card) 60%); background-size: 200% 100%; animation: brilho 1.4s ease-in-out infinite; border-radius: 10px; }
  @keyframes brilho { 0% { background-position: 180% 0; } 100% { background-position: -20% 0; } }
  .skeleton-botoes { display: flex; flex-direction: column; gap: 12px; padding: 18px 16px; max-width: 480px; margin: 0 auto; }
  .skeleton-botao { height: 56px; }

  .avaliacoes { padding: 6px 16px 6px; max-width: 480px; margin: 0 auto; }
  .avaliacoes h2 { margin: 0 0 4px; font-family: 'Playfair Display', serif; font-weight: 600; font-size: 1.2rem; color: var(--dourado-claro); text-align: center; }
  .avaliacoes-resumo { text-align: center; color: var(--texto-suave); font-size: 0.85rem; margin-bottom: 14px; }
  .avaliacoes-resumo strong { color: var(--dourado-claro); }
  .avaliacoes-lista { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .avaliacoes-lista::-webkit-scrollbar { display: none; }
  .avaliacao-card { flex: 0 0 240px; background: var(--marrom-card); border: 1px solid var(--borda); border-radius: 12px; padding: 14px; }
  .avaliacao-estrelas { color: var(--dourado); font-size: 0.8rem; letter-spacing: 1px; margin-bottom: 6px; }
  .avaliacao-texto { font-size: 0.83rem; color: var(--texto); line-height: 1.45; margin: 0 0 8px; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .avaliacao-autor { font-size: 0.76rem; color: var(--texto-suave); font-weight: 600; }

  .mapa-embed { width: 100%; height: 220px; border: 0; border-radius: 12px; margin-bottom: 12px; display: block; }
</style>
</head>
<body>
  <div class="topo">
    <img id="logo-img" class="logo-imagem escondido" alt="Serra Dourada Bar e Restaurante" />
    <div id="logo-texto">
      <p class="logo-script" id="logo-nome">Serra Dourada</p>
      <p class="logo-label">BAR E RESTAURANTE</p>
    </div>
  </div>

  <div class="hero" id="hero">
    <div class="placeholder-icone">🍺</div>
    <div class="hero-legenda" id="hero-legenda"></div>
  </div>

  <p class="boas-vindas" id="boas-vindas">Bem-vindo!</p>

  <section class="destaques">
    <h2>Destaques da casa</h2>
    <div class="destaques-grid">
      <figure><img src="img/destaque-5.jpg" alt="Prato do Serra Dourada" loading="lazy" /></figure>
      <figure><img src="img/destaque-1.jpg" alt="Prato do Serra Dourada" loading="lazy" /></figure>
      <figure><img src="img/destaque-2.jpg" alt="Prato do Serra Dourada" loading="lazy" /></figure>
      <figure><img src="img/destaque-3.jpg" alt="Prato do Serra Dourada" loading="lazy" /></figure>
      <figure><img src="img/destaque-4.jpg" alt="Prato do Serra Dourada" loading="lazy" /></figure>

    <p class="avaliacoes-resumo" id="avaliacoes-resumo"></p>
    <div class="avaliacoes-lista" id="avaliacoes-lista"></div>
  </section>

  <nav class="botoes escondido" id="botoes">
    <div class="carregando-botoes">Carregando…</div>
  </nav>
  <div class="skeleton-botoes" id="skeleton-botoes">
    <div class="skeleton skeleton-botao"></div>
    <div class="skeleton skeleton-botao"></div>
    <div class="skeleton skeleton-botao"></div>
    <div class="skeleton skeleton-botao"></div>
  </div>

  <footer>Serra Dourada Bar e Restaurante · Goiânia/GO</footer>

  <div class="barra-fixa">
    <button type="button" id="barra-cardapio" class="principal">
      <span class="icone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H12v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M20 5.5c0-.8-.7-1.5-1.5-1.5H12v16h6.5a1.5 1.5 0 0 0 1.5-1.5z"/></svg></span>
      Cardápio
    </button>
    <button type="button" id="barra-whatsapp" class="secundaria">
      <span class="icone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1.3-3.9A8 8 0 1 1 8.9 19z"/><path d="M8.5 9.5c0 3.5 2.5 6 6 6"/></svg></span>
      WhatsApp
    </button>

  <div class="overlay" id="overlay">
    <div class="modal">

        <h2 id="modal-titulo">—</h2>
        <button class="modal-fechar" id="modal-fechar" aria-label="Fechar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div id="modal-corpo"></div>
      <form id="form-reserva" class="escondido">
        <label for="reserva-nome">Seu nome</label>
        <input type="text" id="reserva-nome" required autocomplete="name" />
        <label for="reserva-telefone">Seu WhatsApp</label>
        <input type="text" id="reserva-telefone" required autocomplete="tel" placeholder="Ex.: 62999998888" />
        <label class="consentimento">
          <input type="checkbox" id="reserva-consentimento" required />
          <span>Aceito ser contatado pelo Serra Dourada por WhatsApp sobre esta reserva e futuras novidades.</span>
        </label>
        <button type="submit" class="botao destaque" id="btn-continuar-whatsapp" style="width:100%">Continuar para o WhatsApp</button>
        <p class="modal-vazio" id="msg-reserva" style="padding:8px 0 0"></p>

  </div>

<script>
window.addEventListener("DOMContentLoaded", function () {
  "use strict";
  var SUPABASE_URL = "https://bhxnhiggogosootbtwpb.supabase.co";
  var ANON_KEY = "sb_publishable_Zsg8lPJjUHK5-okGOuYc9g_VbKilzQG";
  var sb = window.supabase.createClient(SUPABASE_URL, ANON_KEY);

  var DIAS = ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];
  var estabelecimentoId = null;
  var config = null;
  var happyHourBadgeAtivo = false;

  function escapeHtml(v) {
    return String(v == null ? "" : v)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function abrirModal(titulo, corpoHtml) {
    document.getElementById("modal-titulo").textContent = titulo;
    document.getElementById("modal-corpo").innerHTML = corpoHtml;
    document.getElementById("form-reserva").classList.add("escondido");
    document.getElementById("overlay").classList.add("aberto");
  }
  function fecharModal() {
    document.getElementById("overlay").classList.remove("aberto");
    document.getElementById("form-reserva").classList.add("escondido");
  }
  function abrirReserva() {
    document.getElementById("modal-titulo").textContent = "Fazer reserva";
    document.getElementById("modal-corpo").innerHTML =
      '<p class="modal-vazio" style="padding:0 0 4px;text-align:left">Deixe seu contato para confirmarmos e você será direcionado ao WhatsApp.</p>';
    document.getElementById("msg-reserva").textContent = "";
    document.getElementById("form-reserva").classList.remove("escondido");
    document.getElementById("overlay").classList.add("aberto");
  }
  document.getElementById("modal-fechar").addEventListener("click", fecharModal);
  document.getElementById("overlay").addEventListener("click", function (e) {
    if (e.target.id === "overlay") fecharModal();
  });

  function registrar(tipo, botaoTipo) {
    if (!estabelecimentoId) return;
    sb.from("pagina_acesso_log").insert({
      estabelecimento_id: estabelecimentoId,
      tipo: tipo,
      botao_tipo: botaoTipo || null,
    }).then(function () {});
  }

  function formatarHora(t) {
    if (!t) return "";
    return t.slice(0, 5);
  }

  function formatarPreco(p) {
    var n = Number(p);
    if (isNaN(n)) return "";
    return "R$ " + n.toFixed(2).replace(".", ",");
  }

  async function mostrarHorario() {
    var h = (config && config.horario_funcionamento) || {};
    var algumDiaConfigurado = false;
    var linhas = DIAS.map(function (nome, i) {
      var v = h[String(i)] || {};
      var turnos = [];
      if (v.almoco && v.almoco.abre && v.almoco.fecha) turnos.push(formatarHora(v.almoco.abre) + "–" + formatarHora(v.almoco.fecha));
      if (v.bar && v.bar.abre && v.bar.fecha) turnos.push(formatarHora(v.bar.abre) + "–" + formatarHora(v.bar.fecha));
      if (turnos.length) algumDiaConfigurado = true;
      var texto = turnos.length ? turnos.join(" e ") : "Fechado";
      return '<div class="horario-linha"><span>' + nome + '</span><span>' + escapeHtml(texto) + '</span></div>';
    }).join("");
    abrirModal("Horário de funcionamento", algumDiaConfigurado ? linhas : '<p class="modal-vazio">Horário não configurado ainda.</p>');
  }

  async function mostrarAlmoco() {
    var r = await sb.from("almoco_dia").select("descricao,imagem_url,data").eq("ativo", true).limit(1).maybeSingle();
    if (!r.data) {
      abrirModal("Almoço de hoje", '<p class="modal-vazio">O almoço de hoje ainda não foi publicado.</p>');
      return;
    }
    var imagemHtml = r.data.imagem_url
      ? '<img class="modal-foto" src="' + escapeHtml(r.data.imagem_url) + '" alt="Almoço de hoje" />'
      : "";
    abrirModal("Almoço de hoje", imagemHtml + '<div class="modal-item"><p>' + escapeHtml(r.data.descricao).replace(/\n/g, "<br>") + "</p></div>");
  }

  async function mostrarHappyHour() {
    var [hhRes, promoRes] = await Promise.all([
      sb.from("happy_hour").select("descricao,dias_semana,horario_inicio,horario_fim,ativo,itens").maybeSingle(),
      sb.from("promocao").select("titulo,descricao,valido_ate").order("ordem", { ascending: true }),
    ]);

    var blocos = [];

    if (hhRes.data && hhRes.data.ativo) {
      var dias = (hhRes.data.dias_semana || []).map(function (d) { return DIAS[d]; }).join(", ");
      var periodo = formatarHora(hhRes.data.horario_inicio) + " às " + formatarHora(hhRes.data.horario_fim);
      var itensHtml = "";
      if (hhRes.data.itens && hhRes.data.itens.length) {
        itensHtml = '<div class="hh-itens">' + hhRes.data.itens.map(function (it) {
          var fotoHtml = it.foto_url ? '<img class="hh-item-foto" src="' + escapeHtml(it.foto_url) + '" alt="" loading="lazy" />' : '';
          return '<div class="hh-item"><span class="hh-item-esquerda">' + fotoHtml + '<span class="hh-item-nome">' + escapeHtml(it.nome) + '</span></span>' +
            '<span class="hh-item-precos"><span class="hh-item-preco-de">' + formatarPreco(it.preco_de) + '</span>' +
            '<span class="hh-item-preco-por">' + formatarPreco(it.preco_por) + '</span></span></div>';
        }).join("") + '</div>';
      }
      blocos.push(
        '<div class="modal-fotos"><img src="img/happyhour-1.jpg" alt="Drinks do Happy Hour" /><img src="img/happyhour-3.jpg" alt="Petisco do Happy Hour" /></div>'
      );
      blocos.push(
        '<div class="modal-item"><h3>Happy Hour · ' + escapeHtml(dias || "Todos os dias") + '</h3><p>' + escapeHtml(periodo) + '</p>' +
        (hhRes.data.descricao && !hhRes.data.itens.length ? '<p>' + escapeHtml(hhRes.data.descricao).replace(/\n/g, "<br>") + '</p>' : '') +
        itensHtml +
        '</div>'
      );
    }

    (promoRes.data || []).forEach(function (p) {
      var validade = p.valido_ate ? " · válida até " + new Date(p.valido_ate + "T00:00:00").toLocaleDateString("pt-BR") : "";
      blocos.push(
        '<div class="modal-item"><h3>' + escapeHtml(p.titulo) + escapeHtml(validade) + '</h3>' +
        (p.descricao ? '<p>' + escapeHtml(p.descricao).replace(/\n/g, "<br>") + '</p>' : '') +
        '</div>'
      );
    });

    abrirModal("Happy Hour e promoções", blocos.join("") || '<p class="modal-vazio">Nenhum Happy Hour ou promoção ativa no momento.</p>');
  }

  function mostrarComoChegar() {
    var endereco = config && config.endereco_embed;
    var temCoord = config && config.mapa_lat != null && config.mapa_lng != null;
    var consultaMapa = temCoord ? (config.mapa_lat + "," + config.mapa_lng) : endereco;
    var mapaHtml = consultaMapa
      ? '<iframe class="mapa-embed" src="https://www.google.com/maps?q=' + encodeURIComponent(consultaMapa) + (temCoord ? "&z=17" : "") + '&output=embed" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>'
      : "";
    var linkMaps = (config && config.google_maps_url) || null;
    var botaoHtml = linkMaps
      ? '<a class="botao destaque" style="width:100%;justify-content:center" href="' + escapeHtml(linkMaps) + '" target="_blank" rel="noopener">Abrir rota no Google Maps</a>'
      : "";
    abrirModal("Como chegar", mapaHtml + (endereco ? '<p class="modal-vazio" style="padding:0 0 10px">' + escapeHtml(endereco) + '</p>' : "") + botaoHtml);
  }

  function renderAvaliacoes(cache) {
    var secao = document.getElementById("avaliacoes");
    if (!cache || !cache.reviews || !cache.reviews.length) return;
    var estrelasTexto = function (n) { return "★★★★★☆☆☆☆☆".slice(5 - Math.round(n), 10 - Math.round(n)); };
    document.getElementById("avaliacoes-resumo").innerHTML =
      "<strong>" + (cache.rating || "-") + "</strong> de 5 · " + (cache.total_avaliacoes || cache.reviews.length) + " avaliações no Google";
    document.getElementById("avaliacoes-lista").innerHTML = cache.reviews.slice(0, 8).map(function (r) {
      return '<div class="avaliacao-card">' +
        '<div class="avaliacao-estrelas">' + estrelasTexto(r.nota || 5) + '</div>' +
        '<p class="avaliacao-texto">' + escapeHtml(r.texto || "") + '</p>' +
        '<div class="avaliacao-autor">' + escapeHtml(r.autor || "Cliente Google") + '</div>' +
        '</div>';
    }).join("");
    secao.classList.remove("escondido");
  }

  async function mostrarEventos() {
    var r = await sb.from("evento").select("titulo,descricao,data_hora").eq("ativo", true).gte("data_hora", new Date().toISOString()).order("data_hora", { ascending: true });
    if (!r.data || r.data.length === 0) {
      abrirModal("Próximos eventos", '<p class="modal-vazio">Nenhum evento programado no momento.</p>');
      return;
    }
    var html = r.data.map(function (ev) {
      var data = new Date(ev.data_hora).toLocaleString("pt-BR", { weekday: "long", day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
      return '<div class="modal-item"><h3>' + escapeHtml(ev.titulo) + '</h3><p>' + escapeHtml(data) + '</p>' +
        (ev.descricao ? '<p>' + escapeHtml(ev.descricao) + '</p>' : '') + '</div>';
    }).join("");
    abrirModal("Próximos eventos", html);
  }

  function linkWhatsapp(mensagem) {
    var numero = (config && config.whatsapp || "").replace(/\D/g, "");
    if (!numero) return null;
    return "https://wa.me/" + numero + (mensagem ? "?text=" + encodeURIComponent(mensagem) : "");
  }

  var ACOES = {
    cardapio: function () { registrar("click", "cardapio"); location.href = "cardapio.html"; },
    almoco: function () { registrar("click", "almoco"); mostrarAlmoco(); },
    happy_hour: function () { registrar("click", "happy_hour"); mostrarHappyHour(); },
    horario: function () { registrar("click", "horario"); mostrarHorario(); },
    eventos: function () { registrar("click", "eventos"); mostrarEventos(); },
    reserva_whatsapp: function () { registrar("click", "reserva_whatsapp"); abrirReserva(); },
    maps: function () { registrar("click", "maps"); mostrarComoChegar(); },
  };

  document.getElementById("form-reserva").addEventListener("submit", async function (ev) {
    ev.preventDefault();
    var msgEl = document.getElementById("msg-reserva");
    var nome = document.getElementById("reserva-nome").value.trim();
    var telefone = document.getElementById("reserva-telefone").value.replace(/\D/g, "");
    msgEl.textContent = "";
    if (!nome || !telefone) {
      msgEl.textContent = "Preencha seu nome e WhatsApp.";
      return;
    }
    var link = linkWhatsapp("Olá! Meu nome é " + nome + ", gostaria de fazer uma reserva no Serra Dourada.");
    if (!link) {
      msgEl.textContent = "Reservas por WhatsApp indisponíveis no momento. Tente outro contato.";
      return;
    }
    try {
      await sb.from("contato_publico").insert({
        estabelecimento_id: estabelecimentoId,
        nome: nome,
        telefone: telefone,
        mensagem: "Reserva solicitada pelo botão do site (WhatsApp)",
        status: "novo",
      });
    } catch (e) { /* não bloqueia o cliente se o registro falhar */ }
    window.open(link, "_blank", "noopener");
    fecharModal();
    document.getElementById("form-reserva").reset();
  });

  document.getElementById("barra-cardapio").addEventListener("click", function () { ACOES.cardapio(); });
  document.getElementById("barra-whatsapp").addEventListener("click", function () { ACOES.reserva_whatsapp(); });

  var SW = 'fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"';
  var ICONES = {
    cardapio: '<svg viewBox="0 0 24 24" ' + SW + '><path d="M4 5.5C4 4.7 4.7 4 5.5 4H12v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M20 5.5c0-.8-.7-1.5-1.5-1.5H12v16h6.5a1.5 1.5 0 0 0 1.5-1.5z"/></svg>',
    cardapio_visual: '<svg viewBox="0 0 24 24" ' + SW + '><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M4 16l4.5-4.5a1.6 1.6 0 0 1 2.2 0L15 15.8M14 14.5l1.4-1.4a1.6 1.6 0 0 1 2.2 0L20 15.8"/></svg>',
    almoco: '<svg viewBox="0 0 24 24" ' + SW + '><path d="M7 3v7a2 2 0 1 0 4 0V3M9 10v11M15 3c-1.5 1.5-2 3-2 5s1 3 2 3v10"/></svg>',
    happy_hour: '<svg viewBox="0 0 24 24" ' + SW + '><path d="M6 3h6l-1 8a2 2 0 0 1-2 2 2 2 0 0 1-2-2z"/><path d="M9 13v8M6 21h6"/><path d="M15 8l1.5 1.5L20 6"/><circle cx="17" cy="15" r="4"/><path d="M17 19v2M15 21h4"/></svg>',
    reserva_whatsapp: '<svg viewBox="0 0 24 24" ' + SW + '><path d="M4 20l1.3-3.9A8 8 0 1 1 8.9 19z"/><path d="M8.5 9.5c0 3.5 2.5 6 6 6"/></svg>',
    maps: '<svg viewBox="0 0 24 24" ' + SW + '><path d="M12 21s7-6.6 7-11.5A7 7 0 0 0 5 9.5C5 14.4 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.2"/></svg>',
    horario: '<svg viewBox="0 0 24 24" ' + SW + '><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
    eventos: '<svg viewBox="0 0 24 24" ' + SW + '><path d="M9 18V5l10-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></svg>',
    avaliar_google: '<svg viewBox="0 0 24 24" ' + SW + '><path d="M12 3.5l2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>',
    instagram: '<svg viewBox="0 0 24 24" ' + SW + '><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="0.6" fill="currentColor" stroke="none"/></svg>',
    trabalhe_conosco: '<svg viewBox="0 0 24 24" ' + SW + '><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M8 8V6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
  };
  var SETA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';

  function urlPadrao(tipo) {
    if (tipo === "trabalhe_conosco") return linkWhatsapp("Olá! Tenho interesse em trabalhar no Serra Dourada.");
    if (tipo === "avaliar_google") return config && config.avaliacao_url;
    if (tipo === "instagram") return config && config.instagram_url;
    return null;
  }

  var SEMPRE_MODAL = { maps: true };

  function renderBotoes(botoes) {
    var nav = document.getElementById("botoes");
    if (!botoes.length) {
      nav.innerHTML = '<p class="modal-vazio">Nenhum botão configurado ainda.</p>';
      return;
    }
    nav.innerHTML = "";
    botoes.forEach(function (b, i) {
      var url = b.url || urlPadrao(b.tipo);
      var el;
      if (ACOES[b.tipo] && (!url || SEMPRE_MODAL[b.tipo])) {
        el = document.createElement("button");
        el.type = "button";
        el.addEventListener("click", ACOES[b.tipo]);
      } else if (url) {
        el = document.createElement("a");
        el.href = url;
        el.target = "_blank";
        el.rel = "noopener";
        el.addEventListener("click", function () { registrar("click", b.tipo); });
      } else {
        return; // sem ação nem link configurado — não mostra
      }
      el.className = "botao" + (i === 0 ? " destaque" : "");
      var badge = (b.tipo === "happy_hour" && happyHourBadgeAtivo) ? '<span class="badge-ativo">Ativo agora</span>' : "";
      el.innerHTML =
        '<span class="icone">' + (ICONES[b.tipo] || "") + '</span>' +
        '<span>' + escapeHtml(b.label) + badge + '</span>' +
        '<span class="seta">' + SETA + '</span>';
      nav.appendChild(el);
    });
  }

  function happyHourAtivoAgora(hh) {
    if (!hh || !hh.ativo || !hh.horario_inicio || !hh.horario_fim) return false;
    var agora = new Date();
    var diasSemana = hh.dias_semana || [];
    var horaAtual = agora.getHours() * 60 + agora.getMinutes();
    var partesInicio = hh.horario_inicio.split(":");
    var partesFim = hh.horario_fim.split(":");
    var inicioMin = Number(partesInicio[0]) * 60 + Number(partesInicio[1]);
    var fimMin = Number(partesFim[0]) * 60 + Number(partesFim[1]);

    function diaPermitido(dia) { return !diasSemana.length || diasSemana.indexOf(dia) !== -1; }
    function dentro(dia) {
      if (!diaPermitido(dia)) return false;
      if (fimMin > inicioMin) return horaAtual >= inicioMin && horaAtual < fimMin;
      return horaAtual >= inicioMin || horaAtual < fimMin; // turno vira a noite
    }

    if (dentro(agora.getDay())) return true;
    if (fimMin <= inicioMin && horaAtual < fimMin) {
      var diaAnterior = (agora.getDay() + 6) % 7;
      if (diaPermitido(diaAnterior)) return true;
    }
    return false;
  }

  var LIMIAR_QUENTE_C = 30;
  var IMAGEM_CLIMA_QUENTE = "https://serradouradabar.com.br/img/happyhour-1.jpg";
  var LEGENDA_CLIMA_QUENTE = "Dia de calor pede um drink gelado 🍹";

  async function ajustarHeroPorClima(mensagemPadrao) {
    try {
      var lat = (config.mapa_lat != null) ? config.mapa_lat : -16.6799;
      var lng = (config.mapa_lng != null) ? config.mapa_lng : -49.2550;
      var resp = await fetch(
        "https://api.open-meteo.com/v1/forecast?latitude=" + lat + "&longitude=" + lng + "&current=temperature_2m"
      );
      if (!resp.ok) return;
      var dados = await resp.json();
      var temp = dados && dados.current && dados.current.temperature_2m;
      if (typeof temp !== "number" || temp < LIMIAR_QUENTE_C) return;

      var heroImg = document.querySelector("#hero img");
      var heroLegenda = document.getElementById("hero-legenda");
      if (heroImg) heroImg.src = IMAGEM_CLIMA_QUENTE;
      if (heroLegenda) heroLegenda.textContent = LEGENDA_CLIMA_QUENTE;
    } catch (e) {
      // Falha silenciosa: se o clima não carregar, mantém a imagem padrão já exibida.
    }
  }

  async function carregar() {
    try {
      var estRes = await sb.from("estabelecimento").select("id,nome_fantasia,nome,endereco").limit(1).maybeSingle();
      if (!estRes.data) return;
      estabelecimentoId = estRes.data.id;
      var nomeCurto = (estRes.data.nome_fantasia || estRes.data.nome || "").replace(/bar e restaurante/i, "").trim();
      if (nomeCurto) document.getElementById("logo-nome").textContent = nomeCurto;

      var [cfgRes, botoesRes, hhRes, avalRes] = await Promise.all([
        sb.from("pagina_config").select("*").eq("estabelecimento_id", estabelecimentoId).maybeSingle(),
        sb.from("botao_pagina").select("*").eq("estabelecimento_id", estabelecimentoId).eq("ativo", true).order("ordem", { ascending: true }),
        sb.from("happy_hour").select("ativo,dias_semana,horario_inicio,horario_fim").maybeSingle(),
        sb.from("google_reviews_cache").select("rating,total_avaliacoes,reviews").eq("estabelecimento_id", estabelecimentoId).maybeSingle(),
      ]);
      happyHourBadgeAtivo = happyHourAtivoAgora(hhRes.data);
      renderAvaliacoes(avalRes.data);

      config = cfgRes.data;
      if (config) {
        config.endereco_embed = estRes.data.endereco || null;
        if (config.imagem_logo_url) {
          var logoImg = document.getElementById("logo-img");
          logoImg.src = config.imagem_logo_url;
          logoImg.classList.remove("escondido");
          document.getElementById("logo-texto").classList.add("escondido");
        }
        var mensagem = config.mensagem_boas_vindas || "";
        if (config.imagem_hero_url) {
          document.getElementById("hero").innerHTML =
            '<img src="' + escapeHtml(config.imagem_hero_url) + '" alt="Serra Dourada" loading="eager" />' +
            '<div class="hero-legenda" id="hero-legenda">' + escapeHtml(mensagem) + '</div>';
          document.getElementById("boas-vindas").remove();
          if (config.hero_por_clima) ajustarHeroPorClima(mensagem);
        } else {
          document.getElementById("boas-vindas").textContent = mensagem;
        }
      }

      renderBotoes(botoesRes.data || []);
      document.getElementById("skeleton-botoes").classList.add("escondido");
      document.getElementById("botoes").classList.remove("escondido");
      registrar("pageview", null);
    } catch (e) {
      document.getElementById("skeleton-botoes").classList.add("escondido");
      document.getElementById("botoes").classList.remove("escondido");
      document.getElementById("botoes").innerHTML = '<p class="modal-vazio">Não foi possível carregar a página. Verifique sua conexão.</p>';
    }
  }

  carregar();
});
</script>
</body>
</html>
