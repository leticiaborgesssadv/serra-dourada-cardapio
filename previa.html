<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
<style>
  :root {
    --dourado: #c9a227;
    --dourado-claro: #e8c766;
    --marrom: #1c1108;
    --marrom-2: #241608;
    --marrom-claro: #3a2712;
    --marrom-card: #2e1c0e;
    --texto: #f6ead0;
    --texto-suave: #cdbb99;
    --borda: #4a3520;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--marrom);
    color: var(--texto);
    min-height: 100vh;
  }
  .topo {
    text-align: center;
    padding: 22px 16px 8px calc(16px + env(safe-area-inset-left, 0px));
    padding-top: calc(22px + env(safe-area-inset-top, 0px));
  }
  .logo-script {
    font-family: 'Playball', cursive;
    font-size: 2.6rem;
    color: var(--dourado-claro);
    line-height: 1;
    margin: 0;
  }
  .logo-label {
    font-size: 0.7rem;
    letter-spacing: 0.32em;
    color: var(--texto-suave);
    margin-top: 4px;
    font-weight: 700;
  }
  .logo-imagem {
    max-width: 190px;
    max-height: 130px;
    width: auto;
    height: auto;
    margin: 0 auto;
    display: block;
  }
  .hero {
    margin: 18px 16px 0;
    border-radius: 18px;
    overflow: hidden;
    position: relative;
    aspect-ratio: 2 / 3;
    max-height: 68vh;
    background: radial-gradient(circle at 30% 20%, #4a3010, #1c1108 70%);
    display: flex;
    align-items: flex-end;
  }
  .hero img { width: 100%; height: 100%; object-fit: cover; object-position: center center; display: block; }
  .hero .placeholder-icone {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 4rem;
    opacity: 0.35;
  }
  .hero-legenda {
    position: relative;
    z-index: 1;
    padding: 22px 20px;
    background: linear-gradient(0deg, rgba(0,0,0,0.7), rgba(0,0,0,0.15) 65%, transparent);
    width: 100%;
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 1.15rem;
    line-height: 1.4;
    color: #fdf6e8;
  }
  .boas-vindas {
    text-align: center;
    padding: 18px 24px 4px;
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 1.05rem;
    color: var(--texto-suave);
    line-height: 1.5;
  }
  .destaques {
    padding: 22px 16px 6px;
    max-width: 480px;
    margin: 0 auto;
  }
  .destaques h2 {
    margin: 0 0 14px;
    font-family: 'Playfair Display', serif;
    font-weight: 600;
    font-size: 1.2rem;
    letter-spacing: 0.01em;
    color: var(--dourado-claro);
    text-align: center;
  }
  .destaques-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .destaques-grid figure {
    margin: 0;
    border-radius: 14px;
    overflow: hidden;
    background: var(--marrom-card);
    aspect-ratio: 4 / 3;
  }
  .destaques-grid figure:first-child {
    grid-column: span 2;
    aspect-ratio: 16 / 10;
  }
  .destaques-grid img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .botoes {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
    padding: 18px 16px calc(28px + env(safe-area-inset-bottom, 0px));
    max-width: 480px;
    margin: 0 auto;
  }
  .botao {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    text-align: left;
    padding: 15px 18px;
    border-radius: 10px;
    background: var(--marrom-card);
    border: 1px solid var(--borda);
    color: var(--texto);
    font-family: inherit;
    font-size: 0.96rem;
    font-weight: 600;
    letter-spacing: 0.015em;
    text-decoration: none;
    cursor: pointer;
    min-height: 56px;
    transition: transform 0.08s ease, border-color 0.15s ease, background 0.15s ease;
  }
  .botao:active { transform: scale(0.98); }
  .botao.destaque {
    background: var(--dourado);
    color: #241608;
    border-color: transparent;
    font-weight: 700;
  }
  .botao .icone {
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--dourado-claro);
  }
  .botao.destaque .icone { color: #241608; }
  .botao .icone svg { width: 100%; height: 100%; }
  .botao .seta {
    margin-left: auto;
    flex-shrink: 0;
    width: 15px;
    height: 15px;
    opacity: 0.5;
  }
  .carregando-botoes {
    text-align: center;
    color: var(--texto-suave);
    padding: 20px;
    font-size: 0.9rem;
  }
  .badge-ativo {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-left: 8px;
    padding: 2px 8px;
    border-radius: 20px;
    background: #3a8f52;
    color: #eafff0;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.01em;
    vertical-align: middle;
  }
  .badge-ativo::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #7cf7a3;
    box-shadow: 0 0 4px #7cf7a3;
  }
.botao-texto { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.botao-subtitulo { font-size: 0.76rem; font-weight: 600; opacity: 0.85; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.botao.destaque .botao-subtitulo { opacity: 0.75; }
.promo-dia-destaque { padding: 4px 16px 2px; max-width: 480px; margin: 0 auto; }
.promo-dia-card { display: flex; align-items: center; gap: 14px; border-radius: 16px; background: linear-gradient(135deg, var(--dourado), #a9791c); color: #241608; padding: 16px 18px; cursor: pointer; border: none; width: 100%; text-align: left; font-family: inherit; }
.promo-dia-card img { width: 56px; height: 56px; border-radius: 12px; object-fit: cover; flex-shrink: 0; }
.promo-dia-textos { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.promo-dia-label { font-size: 0.68rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.75; }
.promo-dia-titulo { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 1.05rem; line-height: 1.25; }
.pd-cap { font-size: 0.68rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dourado); }
.pd-titulo { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 1.5rem; color: var(--dourado-claro); margin: 2px 0 10px; line-height: 1.15; }
.pd-caixa { background: var(--marrom); border: 1px solid var(--borda); border-radius: 14px; padding: 16px; text-align: center; }
.pd-caixa-rot { font-size: 0.75rem; color: var(--texto-suave); }
.pd-caixa-num { font-size: 2rem; font-weight: 800; color: var(--dourado-claro); letter-spacing: 0.02em; line-height: 1.2; }
.pd-texto { font-size: 0.88rem; color: var(--texto); line-height: 1.45; margin: 12px 0 0; }
.pd-cond { font-size: 0.78rem; color: var(--texto-suave); line-height: 1.45; margin: 10px 0 0; }
.pd-rodape { font-size: 0.72rem; color: #8f7d5f; text-align: center; margin: 14px 0 0; }
.pd-bilhete { background: linear-gradient(135deg, var(--dourado), #a9791c); color: #241608; border-radius: 16px; padding: 16px; }
.pd-bilhete .pd-cap { color: #241608; opacity: 0.7; }
.pd-bilhete .pd-titulo { color: #241608; margin-bottom: 12px; }
.pd-cartela { display: flex; gap: 8px; justify-content: center; background: var(--marrom-2); border-radius: 12px; padding: 12px 8px; }
.pd-garrafa { width: 48px; height: 66px; border-radius: 10px; border: 1.5px dashed #6b4a1f; background: var(--marrom); display: flex; align-items: center; justify-content: center; cursor: pointer; color: #6b4a1f; padding: 0; font-family: inherit; }
.pd-garrafa svg { width: 28px; height: 28px; }
.pd-garrafa.on { border-style: solid; border-color: var(--dourado); background: var(--marrom-claro); color: var(--dourado-claro); }
.pd-garrafa.brinde { border-color: var(--dourado); }
.pd-garrafa.brinde.on { background: var(--dourado); color: #241608; }
.pd-status { text-align: center; font-size: 0.85rem; font-weight: 800; margin: 10px 0 12px; }
.pd-relogio { background: var(--marrom-2); color: var(--dourado-claro); border-radius: 12px; padding: 10px; text-align: center; }
.pd-relogio .d { font-size: 1.25rem; font-weight: 800; }
.pd-relogio .h { font-size: 1rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.pd-bilhete .pd-cond { color: #241608; opacity: 0.85; }
.pd-selo { width: 96px; height: 96px; border-radius: 50%; background: var(--dourado); color: #241608; display: flex; align-items: center; justify-content: center; margin: 8px auto 12px; }
.pd-selo svg { width: 50px; height: 50px; }
.pd-sec { display: block; width: 100%; text-align: center; margin-top: 10px; padding: 12px; border-radius: 10px; border: 1px solid var(--borda); background: transparent; color: var(--texto-suave); font-family: inherit; font-weight: 700; font-size: 0.9rem; cursor: pointer; }
.previa-barra { position: sticky; top: 0; z-index: 60; background: #7a1f1f; color: #fff; font-size: 0.78rem; padding: 8px 10px; display: flex; gap: 6px; align-items: center; justify-content: center; flex-wrap: wrap; }
.previa-barra button { font-family: inherit; font-size: 0.75rem; font-weight: 700; border: 1px solid #fff; background: transparent; color: #fff; border-radius: 20px; padding: 4px 10px; cursor: pointer; }
.previa-barra button.sel { background: #fff; color: #7a1f1f; }
.promo-dia-desc { font-size: 0.8rem; opacity: 0.85; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  body { padding-bottom: 74px; }
  .barra-fixa {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 40;
    display: flex;
    gap: 10px;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
    background: rgba(28, 17, 8, 0.97);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    border-top: 1px solid var(--borda);
  }
  .barra-fixa button {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 12px;
    border-radius: 10px;
    font-family: inherit;
    font-weight: 700;
    font-size: 0.86rem;
    border: none;
    cursor: pointer;
    min-height: 46px;
  }
  .barra-fixa .icone { width: 18px; height: 18px; flex-shrink: 0; }
  .barra-fixa .icone svg { width: 100%; height: 100%; }
  .barra-fixa .principal { background: var(--dourado); color: #241608; }
  .barra-fixa .secundaria { background: var(--marrom-card); color: var(--texto); border: 1px solid var(--borda); }
  footer {
    text-align: center;
    padding: 10px 16px calc(24px + env(safe-area-inset-bottom, 0px));
    color: #7a6448;
    font-size: 0.72rem;
  }

  /* Modal genérico para almoço / happy hour / horário / eventos */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(10, 6, 2, 0.72);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 50;
  }
  .overlay.aberto { display: flex; }
  .modal {
    background: var(--marrom-2);
    border: 1px solid var(--borda);
    border-top-left-radius: 20px;
    border-top-right-radius: 20px;
    width: 100%;
    max-width: 480px;
    max-height: 82vh;
    overflow-y: auto;
    padding: 20px 20px calc(24px + env(safe-area-inset-bottom, 0px));
  }
  .modal-topo {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .modal-topo h2 {
    margin: 0;
    font-family: 'Playfair Display', serif;
    font-weight: 600;
    font-size: 1.2rem;
    color: var(--dourado-claro);
  }
  .modal-fechar {
    background: var(--marrom-card);
    border: 1px solid var(--borda);
    color: var(--texto);
    width: 34px; height: 34px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    flex-shrink: 0;
  }
  .modal-fechar svg { width: 16px; height: 16px; }
  .modal-item {
    background: var(--marrom-card);
    border: 1px solid var(--borda);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 10px;
  }
  .modal-foto {
    width: 100%;
    max-height: 260px;
    object-fit: cover;
    border-radius: 12px;
    margin-bottom: 10px;
    display: block;
  }
  .modal-fotos {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .modal-fotos img {
    flex: 1;
    height: 140px;
    object-fit: cover;
    border-radius: 12px;
  }
  .modal-item h3 { margin: 0 0 4px; font-size: 0.95rem; color: var(--dourado-claro); }
  .modal-item p { margin: 0; font-size: 0.85rem; color: var(--texto-suave); line-height: 1.4; }
  .hh-itens { margin-top: 10px; display: flex; flex-direction: column; gap: 0; }
  .hh-item { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--borda); }
  .hh-item-esquerda { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .hh-item-foto { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; flex-shrink: 0; }
  .hh-item-nome { font-size: 0.88rem; color: var(--texto); }
  .hh-item-precos { white-space: nowrap; text-align: right; }
  .hh-item-preco-de { text-decoration: line-through; color: var(--texto-suave); font-size: 0.78rem; margin-right: 6px; }
  .hh-item-preco-por { color: var(--dourado-claro); font-weight: 700; font-size: 0.92rem; }
  .modal-vazio { text-align: center; color: var(--texto-suave); padding: 24px 0; font-size: 0.88rem; }
  .horario-linha {
    display: flex; justify-content: space-between;
    padding: 8px 4px;
    border-bottom: 1px solid var(--borda);
    font-size: 0.88rem;
  }
  .horario-linha:last-child { border-bottom: none; }
  #form-reserva label {
    display: block;
    font-size: 0.82rem;
    color: var(--texto-suave);
    margin-bottom: 6px;
  }
  .reserva-linha { display: grid; grid-template-columns: 1.4fr 1fr 0.8fr; gap: 8px; }
  #form-reserva input[type=date], #form-reserva input[type=time], #form-reserva input[type=number],
  #form-reserva input[type=text] {
    width: 100%;
    padding: 11px 13px;
    border-radius: 8px;
    border: 1px solid var(--borda);
    background: #1a1006;
    color: var(--texto);
    font-size: 0.92rem;
    margin-bottom: 12px;
    font-family: inherit;
  }
  .consentimento {
    display: flex !important;
    align-items: flex-start;
    gap: 8px;
    font-size: 0.78rem !important;
    color: var(--texto-suave);
    margin-bottom: 14px;
    cursor: pointer;
  }
  .consentimento input { margin-top: 3px; width: 16px; height: 16px; flex-shrink: 0; accent-color: var(--dourado); }

  .escondido { display: none !important; }

  @keyframes surgir { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .topo, .hero, .boas-vindas, .destaques, .avaliacoes, .botoes {
    animation: surgir 0.5s ease both;
  }
  .hero { animation-delay: 0.05s; }
  .boas-vindas { animation-delay: 0.1s; }
  .destaques { animation-delay: 0.15s; }
  .avaliacoes { animation-delay: 0.18s; }
  .botoes { animation-delay: 0.2s; }
  .botao { transition: transform 0.08s ease, border-color 0.15s ease, background 0.15s ease, opacity 0.2s ease; }

  .skeleton { background: linear-gradient(100deg, var(--marrom-card) 30%, #3a2712 45%, var(--marrom-card) 60%); background-size: 200% 100%; animation: brilho 1.4s ease-in-out infinite; border-radius: 10px; }
  @keyframes brilho { 0% { background-position: 180% 0; } 100% { background-position: -20% 0; } }
  .skeleton-botoes { display: flex; flex-direction: column; gap: 12px; padding: 18px 16px; max-width: 480px; margin: 0 auto; }
  .skeleton-botao { height: 56px; }

  .avaliacoes { padding: 6px 16px 6px; max-width: 480px; margin: 0 auto; }
  .avaliacoes h2 { margin: 0 0 4px; font-family: 'Playfair Display', serif; font-weight: 600; font-size: 1.2rem; color: var(--dourado-claro); text-align: center; }
  .avaliacoes-resumo { text-align: center; color: var(--texto-suave); font-size: 0.85rem; margin-bottom: 14px; }
  .avaliacoes-resumo strong { color: var(--dourado-claro); }
  .avaliacoes-lista { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .avaliacoes-lista::-webkit-scrollbar { display: none; }
  .avaliacao-card { flex: 0 0 240px; background: var(--marrom-card); border: 1px solid var(--borda); border-radius: 12px; padding: 14px; }
  .avaliacao-estrelas { color: var(--dourado); font-size: 0.8rem; letter-spacing: 1px; margin-bottom: 6px; }
  .avaliacao-texto { font-size: 0.83rem; color: var(--texto); line-height: 1.45; margin: 0 0 8px; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .avaliacao-autor { font-size: 0.76rem; color: var(--texto-suave); font-weight: 600; }

  .mapa-embed { width: 100%; height: 220px; border: 0; border-radius: 12px; margin-bottom: 12px; display: block; }
</style>
</head>
<body>
  <div class="topo">
    <img id="logo-img" class="logo-imagem escondido" alt="Serra Dourada Bar e Restaurante" />
    <div id="logo-texto">
      <p class="logo-script" id="logo-nome">Serra Dourada</p>
      <p class="logo-label">BAR E RESTAURANTE</p>
    </div>
  </div>

  <div class="hero" id="hero">
    <div class="placeholder-icone">🍺</div>
    <div class="hero-legenda" id="hero-legenda"></div>
  </div>

  <p class="boas-vindas" id="boas-vindas">Bem-vindo!</p>
  <section class="promo-dia-destaque escondido" id="promo-dia-destaque">
  <button type="button" class="promo-dia-card" id="promo-dia-card"></button>
  </section>

  <section class="destaques">
    <h2>Destaques da casa</h2>
    <div class="destaques-grid">
      <figure><img src="img/destaque-5.jpg" alt="Prato do Serra Dourada" loading="lazy" /></figure>
      <figure><img src="img/destaque-1.jpg" alt="Prato do Serra Dourada" loading="lazy" /></figure>
      <figure><img src="img/destaque-2.jpg" alt="Prato do Serra Dourada" loading="lazy" /></figure>
      <figure><img src="img/destaque-3.jpg" alt="Prato do Serra Dourada" loading="lazy" /></figure>
      <figure><img src="img/destaque-4.jpg" alt="Prato do Serra Dourada" loading="lazy" /></figure>
    </div>
  </section>

  <section class="avaliacoes escondido" id="avaliacoes">
    <h2>O que dizem sobre nós</h2>
    <p class="avaliacoes-resumo" id="avaliacoes-resumo"></p>
    <div class="avaliacoes-lista" id="avaliacoes-lista"></div>
  </section>

  <nav class="botoes escondido" id="botoes">
    <div class="carregando-botoes">Carregando…</div>
  </nav>

function minutosDe(hhmm) { if (!hhmm) return null; var p = hhmm.split(":"); return Number(p[0]) * 60 + Number(p[1]); }

function janelaPromo(p) {
  var ini = minutosDe(p.hora_inicio);
  if (ini == null) return { ini: 0, fim: 1440 };
  var fim = minutosDe(p.hora_fim);
  if (fim == null) {
    var turno = ((config && config.horario_funcionamento) || {})[String(p.dia_semana)];
    fim = turno && turno.bar ? minutosDe(turno.bar.fecha) : 1440;
  }
  if (fim == null || fim <= ini) fim = 1440;
  return { ini: ini, fim: fim };
}

function estadoPromo(p) {
  if (!p) return null;
  var d = agora(), m = d.getHours() * 60 + d.getMinutes(), j = janelaPromo(p);
  if (m < j.ini) return "antes";
  if (m < j.fim) return "ativa";
  return "encerrada";
}

function hhmm(min) { var h = Math.floor(min / 60) % 24, mm = min % 60; return h + "h" + (mm ? String(mm).padStart(2, "0") : ""); }

function chaveCartela() { var d = agora(); return "cartela-" + d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); }
function lerCartela() { try { return Number(localStorage.getItem(chaveCartela())) || 0; } catch (e) { return 0; } }

var SVG_BRINDE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg>';
var SVG_TACA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h12v11a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4z"/><path d="M17 7h1.5a2.5 2.5 0 0 1 0 5H17"/><path d="M5 8h12"/></svg>';
var RODAPE_ALCOOL = '<p class="pd-rodape">Beba com moderação. Venda proibida para menores de 18 anos.</p>';

function pararTimerPromo() { if (promoTimer) { clearInterval(promoTimer); promoTimer = null; } }

function mostrarPromocaoDia() {
  pararTimerPromo();
  var hoje = agora().getDay();
  var promoHoje = promocaoDiaHoje;
  var estado = estadoPromo(promoHoje);
  var corpo = "";

  if (promoHoje && estado === "antes") {
    var j = janelaPromo(promoHoje);
    corpo += '<span class="pd-cap">' + escapeHtml(DIAS[hoje]) + '</span>' +
      '<div class="pd-titulo">' + escapeHtml(promoHoje.titulo) + '</div>' +
      '<div class="pd-caixa"><div class="pd-caixa-rot">Começa em</div><div class="pd-caixa-num" id="pd-contagem">–</div>' +
      '<div class="pd-caixa-rot">hoje, às ' + hhmm(j.ini) + '</div></div>' +
      (promoHoje.descricao ? '<p class="pd-texto">' + escapeHtml(promoHoje.descricao) + ' Já chama a turma.</p>' : '') +
      (promoHoje.condicoes ? '<p class="pd-cond">' + escapeHtml(promoHoje.condicoes) + '</p>' : '') +
      '<button type="button" class="botao destaque" id="pd-agenda" style="justify-content:center;margin-top:14px">Adicionar à agenda</button>' +
      RODAPE_ALCOOL;
  } else if (promoHoje && estado === "ativa") {
    corpo += '<div id="pd-ativa"></div>';
  } else if (promoHoje && estado === "encerrada") {
    corpo += '<p class="modal-vazio">A promoção de hoje já encerrou. Volta na próxima ' + escapeHtml(DIAS[hoje].toLowerCase()) + '!</p>';
  } else {
    corpo += '<p class="modal-vazio">Nenhuma promoção especial hoje.</p>';
  }

  var outrosDias = promocoesSemana.filter(function (p) { return p.ativo && p.dia_semana !== hoje; });
  if (outrosDias.length) {
    corpo += '<p style="font-size:0.8rem;color:var(--texto-suave);margin:16px 0 6px">Promoções da semana</p>' +
      '<div class="hh-itens">' + outrosDias.map(function (p) {
        return '<div class="hh-item"><span class="hh-item-nome">' + escapeHtml(DIAS[p.dia_semana]) + '</span>' +
          '<span class="hh-item-preco-por" style="font-size:0.8rem">' + escapeHtml(p.titulo) + '</span></div>';
      }).join("") + '</div>';
  }

  abrirModal("Promoção de hoje", corpo);

  if (promoHoje && estado === "antes") {
    var tick = function () {
      var el = document.getElementById("pd-contagem");
      if (!el) { pararTimerPromo(); return; }
      var d = agora(), resto = janelaPromo(promoHoje).ini * 60 - (d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds());
      if (resto <= 0) { mostrarPromocaoDia(); return; }
      var h = Math.floor(resto / 3600), m = Math.floor((resto % 3600) / 60);
      el.textContent = (h ? h + "h " : "") + m + "min";

  } else if (promoHoje && estado === "ativa") {
    renderAtiva(promoHoje);
  }
}

function renderAtiva(p) {

  var alvo = document.getElementById("pd-ativa");

  if (qtd && n >= qtd) {
    alvo.innerHTML = '<div style="text-align:center">' +
      '<span class="pd-cap">Rodada liberada</span>' +
      '<div class="pd-selo">' + SVG_TACA + '</div>' +
      '<div class="pd-titulo" style="margin-bottom:4px">' + escapeHtml(p.titulo) + '</div>' +

  } else {
    var garrafas = "";

    if (qtd) garrafas += '<span class="pd-garrafa brinde" aria-hidden="true">' + SVG_BRINDE + '</span>';
    var faltam = qtd - n;
    alvo.innerHTML = '<div class="pd-bilhete">' +
      '<span class="pd-cap">Mostre esta tela ao garçom</span>' +
      '<div class="pd-titulo">' + escapeHtml(p.titulo) + '</div>' +
      (qtd ? '<div class="pd-cartela">' + garrafas + '</div>' +
        '<div class="pd-status">' + (n === 0 ? "Toque em cada " + escapeHtml(p.cartela_item || "item") + " que chegar" : "Falta" + (faltam > 1 ? "m " : " ") + faltam + " para liberar a cortesia") + '</div>'
        : (p.descricao ? '<p class="pd-texto" style="color:#241608;margin:0 0 12px">' + escapeHtml(p.descricao) + '</p>' : '')) +
      '<div class="pd-relogio"><div style="font-size:0.72rem;color:var(--texto-suave)">Válido agora</div><div class="d" id="pd-data">' + dataTxt() + '</div><div class="h" id="pd-hora"></div></div>' +
      (p.condicoes ? '<p class="pd-cond">' + escapeHtml(p.condicoes) + '</p>' : '') +
      '</div>' + RODAPE_ALCOOL;
    Array.prototype.forEach.call(alvo.querySelectorAll(".pd-garrafa[data-i]"), function (b) {
      b.addEventListener("click", function () {
        var i = Number(b.getAttribute("data-i"));
        var novo = (n === i + 1) ? i : i + 1;
        gravarCartela(novo);
        if (novo >= qtd) registrar("click", "promo_cartela_completa");
        renderAtiva(p);
      });
    });
  }

  var tick = function () {
    var h = document.getElementById("pd-hora");

    h.textContent = agora().toLocaleTimeString("pt-BR");
    if (estadoPromo(p) !== "ativa") mostrarPromocaoDia();
  };
  tick(); promoTimer = setInterval(tick, 1000);

function baixarAgenda(p) {
  registrar("click", "promo_agenda");
  var d = agora(), j = janelaPromo(p);
  function fmt(dt) { return dt.getFullYear() + String(dt.getMonth() + 1).padStart(2, "0") + String(dt.getDate()).padStart(2, "0") + "T" + String(dt.getHours()).padStart(2, "0") + String(dt.getMinutes()).padStart(2, "0") + "00"; }
  var ini = new Date(d.getFullYear(), d.getMonth(), d.getDate(), Math.floor(j.ini / 60), j.ini % 60);
  var fim = new Date(ini.getTime() + 2 * 3600000);
  var ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Serra Dourada//Promocao//PT", "BEGIN:VEVENT",
    "UID:" + Date.now() + "@serradouradabar.com.br", "DTSTAMP:" + fmt(new Date()),
    "DTSTART;TZID=America/Sao_Paulo:" + fmt(ini), "DTEND;TZID=America/Sao_Paulo:" + fmt(fim),

  function almocoAtivoAgora(turno) {
    if (!turno || !turno.abre || !turno.fecha) return false;
    var agora = new Date();
    var horaAtual = agora.getHours() * 60 + agora.getMinutes();
    var partesInicio = turno.abre.split(":");
    var partesFim = turno.fecha.split(":");
    var inicioMin = Number(partesInicio[0]) * 60 + Number(partesInicio[1]);
    var fimMin = Number(partesFim[0]) * 60 + Number(partesFim[1]);
    if (fimMin > inicioMin) return horaAtual >= inicioMin && horaAtual < fimMin;
    return horaAtual >= inicioMin || horaAtual < fimMin;
  }

  function happyHourAtivoAgora(hh) {
    if (!hh || !hh.ativo || !hh.horario_inicio || !hh.horario_fim) return false;
    var agora = new Date();
    var diasSemana = hh.dias_semana || [];
    var horaAtual = agora.getHours() * 60 + agora.getMinutes();
    var partesInicio = hh.horario_inicio.split(":");
    var partesFim = hh.horario_fim.split(":");
    var inicioMin = Number(partesInicio[0]) * 60 + Number(partesInicio[1]);
    var fimMin = Number(partesFim[0]) * 60 + Number(partesFim[1]);

    function diaPermitido(dia) { return !diasSemana.length || diasSemana.indexOf(dia) !== -1; }
    function dentro(dia) {
      if (!diaPermitido(dia)) return false;
      if (fimMin > inicioMin) return horaAtual >= inicioMin && horaAtual < fimMin;
      return horaAtual >= inicioMin || horaAtual < fimMin; // turno vira a noite
    }

    if (dentro(agora.getDay())) return true;
    if (fimMin <= inicioMin && horaAtual < fimMin) {
      var diaAnterior = (agora.getDay() + 6) % 7;
      if (diaPermitido(diaAnterior)) return true;
    }
    return false;
  }

      }

      var turnoAlmocoHoje = ((config && config.horario_funcionamento) || {})[String(new Date().getDay())];
      turnoAlmocoHoje = turnoAlmocoHoje && turnoAlmocoHoje.almoco;
      almocoBadgeAtivo = almocoAtivoAgora(turnoAlmocoHoje);

      renderBotoes(botoesRes.data || []);
      document.getElementById("skeleton-botoes").classList.add("escondido");
      document.getElementById("botoes").classList.remove("escondido");
      registrar("pageview", null);
    } catch (e) {
      document.getElementById("skeleton-botoes").classList.add("escondido");
      document.getElementById("botoes").classList.remove("escondido");
      document.getElementById("botoes").innerHTML = '<p class="modal-vazio">Não foi possível carregar a página. Verifique sua conexão.</p>';
    }
  }

  if (PREVIA) {
    var barra = document.createElement("div");
    barra.className = "previa-barra";
    barra.innerHTML = '<span>PRÉVIA · simular segunda:</span>' +
      '<button type="button" data-m="antes">Antes das 16h</button>' +
      '<button type="button" data-m="ativa">Promoção valendo</button>' +
      '<button type="button" data-m="zerar">Zerar cartela</button>';
    document.body.insertBefore(barra, document.body.firstChild);
    Array.prototype.forEach.call(barra.querySelectorAll("button"), function (b) {
      if (b.getAttribute("data-m") === previaModo) b.classList.add("sel");
      b.addEventListener("click", function () {
        var m = b.getAttribute("data-m");
        if (m === "zerar") { gravarCartela(0); } else { sessionStorage.setItem("previaModo", m); }
        location.reload();
      });
    });
  }

  carregar();
});
</script>
</body>
</html>
