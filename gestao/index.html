<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Gestão · Serra Dourada</title>
<meta name="theme-color" content="#1b1e21" />
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" type="image/png" sizes="32x32" href="../img/favicon-32.png" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root {
    --dourado: #c9a227; --dourado-claro: #e8c766; --marrom: #1b1e21;
    --marrom-claro: #24282c; --marrom-card: #212427; --texto: #eef0f2;
    --texto-suave: #9aa1a8; --erro: #e5484d; --alerta: #d99a3b; --sucesso: #4caf6d; --borda: #383d42;
    --fundo-input: #16181b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: var(--marrom); color: var(--texto); }
  h2 { margin: 0 0 4px; font-size: 1.2rem; color: var(--dourado-claro); }
  h3 { margin: 0 0 10px; font-size: 0.95rem; color: var(--dourado-claro); }
  label { display: block; font-size: 0.8rem; margin-bottom: 5px; color: var(--texto-suave); }
  input, select {
    width: 100%; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--borda);
    background: var(--fundo-input); color: var(--texto); font-size: 0.88rem; margin-bottom: 11px; font-family: inherit;
  }
  .linha-campos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .botao { display: inline-block; text-align: center; padding: 10px 16px; border-radius: 9px; background: var(--dourado); color: var(--marrom); font-weight: 700; border: none; font-size: 0.86rem; cursor: pointer; width: 100%; }
  .botao:disabled { opacity: 0.5; cursor: default; }
  .botao-secundario { background: transparent; border: 1.5px solid var(--dourado); color: var(--dourado-claro); padding: 10px 16px; border-radius: 9px; cursor: pointer; font-size: 0.86rem; }
  .botao-secundario-pequeno { background: transparent; border: 1px solid var(--borda); color: var(--texto-suave); padding: 6px 10px; border-radius: 7px; cursor: pointer; font-size: 0.76rem; }
  .botao-pequeno { background: transparent; border: 1px solid var(--dourado); color: var(--dourado-claro); padding: 6px 10px; border-radius: 7px; cursor: pointer; font-size: 0.76rem; }
  .card { background: var(--marrom-card); border: 1px solid var(--borda); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .msg-erro { color: var(--erro); font-size: 0.8rem; margin-top: 6px; }
  .vazio { color: var(--texto-suave); font-size: 0.86rem; }

  .tela-centro { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .card-login { max-width: 340px; width: 100%; }
  .card-login .desc { font-size: 0.82rem; color: var(--texto-suave); margin: 0 0 14px; }

  .gestao-shell { display: flex; min-height: 100vh; }
  .gestao-nav { width: 220px; flex-shrink: 0; background: var(--marrom-claro); border-right: 1px solid var(--borda); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
  .gestao-nav-topo { padding: 18px 16px 14px; border-bottom: 1px solid var(--borda); }
  .gestao-nav-titulo { font-size: 0.95rem; font-weight: 700; color: var(--dourado-claro); }
  .gestao-nav-titulo span { display: block; font-size: 0.7rem; font-weight: 400; color: var(--texto-suave); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 2px; }
  .gestao-nav-links { flex: 1; overflow-y: auto; padding: 10px 8px; }
  .gestao-nav-link { display: block; padding: 9px 12px; border-radius: 8px; color: var(--texto-suave); text-decoration: none; font-size: 0.84rem; margin-bottom: 2px; }
  .gestao-nav-link:hover { background: rgba(255,255,255,0.04); }
  .gestao-nav-link.ativo { background: var(--dourado); color: var(--marrom); font-weight: 700; }
  .gestao-nav-link.desabilitado { opacity: 0.45; }
  .gestao-nav-rodape { padding: 12px 16px; border-top: 1px solid var(--borda); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .gestao-nav-usuario { font-size: 0.78rem; color: var(--texto-suave); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gestao-main { flex: 1; min-width: 0; padding: 26px 30px 60px; max-width: 1100px; }

  .em-construcao { padding: 40px 0; }
  .em-construcao p { color: var(--texto-suave); font-size: 0.9rem; }

  .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 14px 0 22px; }
  .stat-box { background: var(--fundo-input); border: 1px solid var(--borda); border-radius: 10px; padding: 12px 14px; }
  .stat-num { font-size: 1.25rem; font-weight: 800; color: var(--dourado-claro); font-variant-numeric: tabular-nums; }
  .stat-lbl { font-size: 0.72rem; color: var(--texto-suave); margin-top: 2px; }
  .stat-box.stat-erro .stat-num { color: var(--erro); }
  .stat-box.stat-alerta .stat-num { color: var(--alerta); }
  .stat-box.stat-ok .stat-num { color: var(--sucesso); }

  .colunas-financeiro { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
  .titulo-lista { margin-top: 4px; }
  .lista-contas { display: flex; flex-direction: column; gap: 8px; }
  .item-conta { background: var(--fundo-input); border: 1px solid var(--borda); border-radius: 9px; padding: 10px 12px; }
  .item-conta-topo { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 4px; }
  .item-conta-desc { font-size: 0.86rem; font-weight: 600; }
  .item-conta-meta { font-size: 0.74rem; color: var(--texto-suave); margin-bottom: 8px; }
  .item-conta-rodape { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .item-conta-valor { font-size: 0.9rem; font-weight: 700; color: var(--dourado-claro); font-variant-numeric: tabular-nums; }

  .chip { display: inline-block; font-size: 0.7rem; font-weight: 700; padding: 3px 9px; border-radius: 20px; white-space: nowrap; }
  .chip-neutro { background: rgba(255,255,255,0.07); color: var(--texto-suave); }
  .chip-ok { background: rgba(76,175,109,0.16); color: var(--sucesso); }
  .chip-alerta { background: rgba(217,154,59,0.18); color: var(--alerta); }
  .chip-erro { background: rgba(229,72,77,0.16); color: var(--erro); }

  .alerta-banner { background: rgba(217,154,59,0.14); border: 1px solid var(--alerta); color: var(--alerta); border-radius: 9px; padding: 10px 14px; font-size: 0.82rem; margin-bottom: 16px; }
  .sub-tabs { display: flex; gap: 8px; margin: 4px 0 18px; }
  .sub-tab { background: transparent; border: 1px solid var(--borda); color: var(--texto-suave); padding: 7px 14px; border-radius: 20px; font-size: 0.8rem; cursor: pointer; }
  .sub-tab.ativo { background: var(--dourado); color: var(--marrom); font-weight: 700; border-color: transparent; }
  .item-clicavel { cursor: pointer; }
  .item-clicavel.selecionado { border-color: var(--dourado); }
  .ficha-tecnica { position: sticky; top: 16px; }
  .desc-form { font-size: 0.76rem; color: var(--texto-suave); margin: -6px 0 14px; }
  .valor-destaque { color: var(--sucesso) !important; }

  input[type=file] { width: 100%; color: var(--texto-suave); font-size: 0.82rem; margin-bottom: 4px; }
  .mapa-colunas { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; }
  .tabela-preview-wrap { overflow-x: auto; border: 1px solid var(--borda); border-radius: 8px; }
  table.tabela-preview { border-collapse: collapse; width: 100%; font-size: 0.78rem; white-space: nowrap; }
  table.tabela-preview th, table.tabela-preview td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--borda); }
  table.tabela-preview th { color: var(--texto-suave); font-weight: 600; background: var(--fundo-input); }
  @media (max-width: 820px) { .mapa-colunas { grid-template-columns: 1fr; } }

  .barra-linha { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 0.8rem; }
  .barra-linha .rotulo { width: 120px; flex-shrink: 0; color: var(--texto-suave); text-transform: capitalize; }
  .barra-linha .barra { flex: 1; background: var(--fundo-input); border-radius: 6px; overflow: hidden; height: 16px; }
  .barra-linha .barra-preenchida { background: var(--dourado); height: 100%; }
  .barra-linha .valor { width: 90px; text-align: right; flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .toggle-linha { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 4px 0; }
  input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--dourado); flex-shrink: 0; }

  @media (max-width: 820px) {
    .gestao-shell { flex-direction: column; }
    .gestao-nav { width: 100%; height: auto; position: static; flex-direction: row; flex-wrap: wrap; }
    .gestao-nav-topo, .gestao-nav-rodape { display: none; }
    .gestao-nav-links { display: flex; overflow-x: auto; padding: 8px; }
    .gestao-nav-link { flex-shrink: 0; }
    .gestao-main { padding: 16px; }
    .stat-grid, .colunas-financeiro, .linha-campos { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="./app.js?v=17"></script>
</body>
</html>
